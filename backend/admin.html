<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mood Wear — Back Office</title>
<style>
:root{--ink:#111;--mut:#8a8a8a;--line:#e8e8e8;--acc:#111;--bg:#fff;--soft:#f6f6f6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Khmer,'Noto Sans Thai',sans-serif;background:var(--bg);color:var(--ink);padding:36px clamp(28px,5vw,84px) 64px}
h1{font-size:26px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.sub{color:var(--mut);font-size:13px;margin-top:6px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0 18px}
.card{flex:1 1 120px;min-width:118px;border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--soft)}
.card b{display:block;font-size:26px;font-weight:700}.card span{font-size:11.5px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-size:13px;cursor:pointer;letter-spacing:.04em}
.tab.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{display:flex;gap:8px;margin:16px 0 12px}
input,select{border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;background:#fff;color:var(--ink)}
input:focus,select:focus{outline:1.5px solid var(--ink)}
input:disabled{background:var(--soft);color:var(--mut)}
.search{flex:1;max-width:340px}
button{border:none;border-radius:10px;padding:9px 16px;font-size:13px;cursor:pointer;font-weight:600;letter-spacing:.03em}
.b1{background:var(--ink);color:#fff}.b1:hover{opacity:.85}
.b2{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.bx{background:#fff;color:#b00;border:1px solid #f3caca}.bx:hover{background:#fdf3f3}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.09em;text-align:left;padding:10px 10px;border-bottom:1px solid var(--ink)}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle;word-break:break-word;max-width:230px}
.tbl td.acts{white-space:nowrap;text-align:right}
.tbl td.imgcell{padding:6px 8px;width:56px}
.tbl input{width:100%;min-width:70px;padding:6px 8px;font-size:13px}
.newrow td{background:var(--soft)}
.tmp{background:#f2f2f2;border-style:dashed}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;opacity:0;transition:.25s}
.toast.show{opacity:1}
.mut{color:var(--mut)}
.thumb{width:42px;height:42px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:var(--soft);display:block}
.thumbs{display:flex;gap:3px;align-items:center}
.thumbs b{font-size:11px;color:var(--mut);font-weight:600}
#dash{display:none}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:20px 0}
.kpi{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--soft)}
.kpi b{display:block;font-size:22px;font-weight:700;margin-top:6px}
.kpi span{font-size:11px;color:var(--mut);letter-spacing:.08em;text-transform:uppercase}
.panel{border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;background:#fff}
.panel h2{font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:16px;color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.chart{display:flex;align-items:flex-end;gap:8px;height:180px}
.chart .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
.chart .bar{width:100%;background:var(--ink);border-radius:6px 6px 0 0;min-height:2px}
.chart .lbl{font-size:10px;color:var(--mut);white-space:nowrap}
.chart .val{font-size:10px;color:var(--ink)}
.rowlist{display:flex;flex-direction:column;gap:12px}
.rowitem{display:flex;align-items:center;gap:10px;font-size:13px}
.rowitem .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rowitem .amt{font-variant-numeric:tabular-nums;color:var(--mut);white-space:nowrap}
.rank{font-size:11px;color:var(--mut);width:16px;text-align:right;font-weight:700}
.track{height:6px;background:var(--soft);border-radius:4px;margin:5px 0 4px}
.track .fill{height:100%;background:var(--ink);border-radius:4px;min-width:3px}
</style>
</head>
<body>
<h1>Mood Wear Back Office</h1>
<div class="sub">ระบบจัดการฐานข้อมูล Mood Wear · แสดง / เพิ่ม / แก้ไข / ลบ ทุกตาราง</div>
<div class="stats" id="stats"></div>
<div class="tabs" id="tabs"></div>
<div id="dash"></div>
<div id="tablewrap">
  <div class="bar">
    <input class="search" id="q" placeholder="ค้นหาในตารางนี้…">
    <button class="b2" id="rref">รีเฟรช</button>
    <button class="b1" id="add">+ เพิ่มข้อมูล</button>
  </div>
  <table class="tbl"><thead id="th"></thead><tbody id="tb"></tbody></table>
</div>
<div class="toast" id="toast"></div>
<script>
const T={
 dashboard:{pk:null,cols:[],label:'แดชบอร์ด'},
 products:{pk:'id',cols:['name','price','category','stock','img','vgroup','vname','vorder'],label:'สินค้า'},
 users:{pk:'id',cols:['username','email','phone','password_hash'],label:'ผู้ใช้'},
 orders:{pk:'id',cols:['user_id','address','total','created_at'],label:'คำสั่งซื้อ'},
 order_items:{pk:'id',cols:['order_id','product_id','quantity','size','color','unit_price'],label:'รายการสินค้าในคำสั่งซื้อ'},
 cart_items:{pk:'id',cols:['user_id','product_id','quantity','size','color'],label:'ตะกร้าสินค้า'},
 favorites:{pk:null,cols:['user_id','product_id','created_at'],label:'รายการที่ถูกใจ'}
};
// คอลัมน์ที่จะแสดงเป็น “ชื่อ” แทนรหัส เพื่อให้อ่านง่าย (แก้ไขยังใช้รหัสจริง)
const ALIAS={
 orders:{user_id:'user_name'},
 order_items:{order_id:'order_ref',product_id:'product_name'},
 cart_items:{user_id:'user_name',product_id:'product_name'},
 favorites:{user_id:'user_name',product_id:'product_name'}
};
// ป้ายหัวคอลัมน์ที่แสดงชื่อแทนรหัส
const ALIAS_LABEL={
 orders:{user_id:'ผู้ใช้ · user_id'},
 order_items:{order_id:'คำสั่งซื้อ · order_id',product_id:'สินค้า · product_id'},
 cart_items:{user_id:'ผู้ใช้ · user_id',product_id:'สินค้า · product_id'},
 favorites:{user_id:'ผู้ใช้ · user_id',product_id:'สินค้า · product_id'}
};
// คอลัมน์รูปภาพของแต่ละตาราง (orders ใช้รูปจาก order_items หลายรูป)
const IMGCOL={products:'img',order_items:'product_img',cart_items:'product_img',favorites:'product_img'};
// รองรับ deep link: /admin?t=orders หรือ /admin?t=products&edit=1 (ใช้ถ่ายภาพประกอบ/บุ๊กมาร์ก)
const QP=new URLSearchParams(location.search);
let cur=(QP.get('t')&&T[QP.get('t')])?QP.get('t'):'dashboard',rows=[],editing=null,nnew=false;
const el=i=>document.getElementById(i);
function toast(m){const t=el('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800);}
const money=n=>'฿'+Number(n||0).toLocaleString('th-TH');
async function stats(){
 const r=await fetch('/admin/stats'),d=await r.json();
 el('stats').innerHTML=Object.entries(d).map(([t,n])=>`<div class="card"><b>${n}</b><span>${T[t]?T[t].label:t}</span></div>`).join('');
}
async function dash(){
 const r=await fetch('/admin/summary');
 if(!r.ok){el('dash').innerHTML='<div class="panel mut">โหลดแดชบอร์ดไม่สำเร็จ ('+r.status+')</div>';return;}
 const d=await r.json(),k=d.kpis;
 const max=Math.max(1,...d.daily.map(x=>x.revenue));
 const catMax=Math.max(1,...d.by_category.map(x=>x.revenue));
 el('dash').innerHTML=`
 <div class="kpis">
  ${[['ยอดขายรวม',money(k.revenue)],['จำนวนคำสั่งซื้อ',k.orders+' ออเดอร์'],['สินค้าที่ขายได้',k.items+' ชิ้น'],
     ['ยอดเฉลี่ยต่อออเดอร์',money(k.avg_order)],['มูลค่าสินค้าในตะกร้า',money(k.cart_value)],
     ['มูลค่าสต็อกคงเหลือ',money(k.stock_value)],['สินค้าใกล้หมด (≤5)',k.low_stock+' รายการ'],['สมาชิก',k.users+' คน']]
   .map(([l,v])=>`<div class="kpi"><span>${l}</span><b>${v}</b></div>`).join('')}
 </div>
 <div class="panel"><h2>ยอดขาย 14 วันล่าสุด</h2>
  <div class="chart">${d.daily.map(x=>`<div class="col" title="${x.day} · ${money(x.revenue)} · ${x.orders} ออเดอร์">
    <div class="val">${x.revenue>=1000?Math.round(x.revenue/1000)+'k':x.revenue}</div>
    <div class="bar" style="height:${Math.max(2,Math.round(x.revenue/max*100))}%"></div>
    <div class="lbl">${x.day.slice(5)}</div></div>`).join('')}</div>
 </div>
 <div class="grid2">
  <div class="panel"><h2>สินค้าขายดี (ตามจำนวนชิ้น)</h2><div class="rowlist">
   ${d.top_products.map((p,i)=>`<div class="rowitem"><span class="rank">${i+1}</span>
     ${p.img?`<img class="thumb" loading="lazy" src="/assets/${p.img}" alt="">`:'<div class="thumb"></div>'}
     <div class="nm" title="${p.name}">${p.name}</div>
     <div class="amt">${p.qty} ชิ้น · ${money(p.revenue)}</div></div>`).join('')||'<div class="mut">ยังไม่มีข้อมูล</div>'}
  </div></div>
  <div class="panel"><h2>ผู้ซื้อสูงสุด</h2><div class="rowlist">
   ${d.top_users.map((u,i)=>`<div class="rowitem"><span class="rank">${i+1}</span>
     <div class="nm">${u.username}</div>
     <div class="amt">${u.orders} ออเดอร์ · ${money(u.spent)}</div></div>`).join('')||'<div class="mut">ยังไม่มีข้อมูล</div>'}
  </div></div>
 </div>
 <div class="grid2">
  <div class="panel"><h2>ยอดขายตามหมวดหมู่</h2><div class="rowlist">
   ${d.by_category.map(c=>`<div><div class="rowitem"><div class="nm">${c.category||'—'}</div>
     <div class="amt">${c.qty} ชิ้น · ${money(c.revenue)}</div></div>
     <div class="track"><div class="fill" style="width:${Math.round(c.revenue/catMax*100)}%"></div></div></div>`).join('')}
  </div></div>
  <div class="panel"><h2>ออเดอร์ล่าสุด</h2><div class="rowlist">
   ${d.recent.map(o=>`<div class="rowitem"><span class="rank">#${o.id}</span>
     <div class="nm">${o.user_name||'—'} · ${o.items_count} รายการ · ${(o.created_at||'').slice(0,16)}</div>
     <div class="amt">${money(o.total)}</div></div>`).join('')||'<div class="mut">ยังไม่มีข้อมูล</div>'}
  </div></div>
 </div>`;
}
async function load(){
 const onDash=cur==='dashboard';
 el('dash').style.display=onDash?'block':'none';
 el('tablewrap').style.display=onDash?'none':'block';
 el('add').style.display=onDash?'none':'';
 el('q').disabled=onDash;
 if(onDash){await dash();return;}
 const q=el('q').value.trim();
 const r=await fetch('/admin/t/'+cur+(q?'?q='+encodeURIComponent(q):''));
 if(!r.ok){toast('โหลดไม่สำเร็จ: '+r.status);rows=[];}
 else rows=await r.json();
 editing=null;nnew=false;
 if(QP.get('edit')==='1'&&rows.length){
  const r0=rows[0];
  editing=T[cur].pk?r0[T[cur].pk]:r0['user_id']+'_'+r0['product_id'];
 }
 render();
}
function cell(c,k,v,inp){return inp?`<input data-k="${k}" value="${v??''}">`:`${v??''}`;}
function thumb(src){
 if(!src)return '<td class="imgcell"><span class="mut">—</span></td>';
 return `<td class="imgcell"><img class="thumb" loading="lazy" src="/assets/${src}" alt=""></td>`;
}
function orderThumbs(r){
 const arr=(r.item_imgs||'').split('|').filter(Boolean);
 if(!arr.length)return '<td class="imgcell"><span class="mut">—</span></td>';
 const more=(r.items_count||0)-arr.length;
 return `<td class="imgcell"><div class="thumbs">${arr.map(s=>`<img class="thumb" loading="lazy" src="/assets/${s}" alt="">`).join('')}${more>0?`<b>+${more}</b>`:''}</div></td>`;
}
function render(){
 const s=T[cur],hasImg=(cur==='orders')||!!IMGCOL[cur];
 const LH=ALIAS_LABEL[cur]||{};
 el('th').innerHTML=`<tr>${hasImg?'<th style="width:56px">รูป</th>':''}${s.cols.map(c=>`<th>${LH[c]||c}</th>`).join('')}<th style="text-align:right">จัดการ</th></tr>`;
 let h='';
 if(nnew)h+=`<tr class="newrow">${hasImg?'<td></td>':''}${s.cols.map(c=>`<td><input data-nk="${c}" placeholder="${c}"></td>`).join('')}<td class="acts"><button class="b1" onclick="saveNew()">บันทึก</button> <button class="b2" onclick="nnew=false;render()">ยกเลิก</button></td></tr>`;
 h+=rows.map(r=>{
  const id=s.pk?r[s.pk]:r['user_id']+'_'+r['product_id'];
  const open=String(editing)===String(id);
  const A=ALIAS[cur]||{};
  const imgCell=hasImg?(cur==='orders'?orderThumbs(r):thumb(r[IMGCOL[cur]])):'';
  return `<tr data-id="${id}">${imgCell}${s.cols.map(c=>{
   if(open)return `<td>${cell(0,c,r[c],1)}</td>`;
   const v=(A[c]&&r[A[c]]!=null&&r[A[c]]!=='')?r[A[c]]:r[c];
   return `<td>${v===null||v===undefined||v===''?'<span class="mut">—</span>':v}</td>`;
  }).join('')}
  <td class="acts">${open?`<button class="b1" onclick="saveEd('${id}')">บันทึก</button> <button class="b2" onclick="editing=null;render()">ยกเลิก</button>`:
  `<button class="b2" onclick="edit('${id}')">แก้ไข</button> <button class="bx" onclick="del('${id}')">ลบ</button>`}</td></tr>`;
 }).join('');
 el('tb').innerHTML=h||`<tr><td colspan="${s.cols.length+1+(hasImg?1:0)}" class="mut" style="padding:24px 10px">ไม่มีข้อมูล</td></tr>`;
}
function edit(id){editing=id;render();}
function add(){nnew=!nnew;editing=null;render();}
function grab(tr,pre){const o={};tr.querySelectorAll('input[data-'+pre+'k]').forEach(i=>{o[i.dataset[pre+'k']]=i.value;});return o;}
function fix(t,o){
 for(const k in o)if(o[k]!==''&&(typeof T[t].defaults?.[k]==='number'))o[k]=+o[k];
 if(t==='products'){['price','stock','vorder'].forEach(k=>{if(o[k]!=='')o[k]=+o[k]||0;});}
 if(t==='orders'){['user_id','total'].forEach(k=>{if(o[k]!=='')o[k]=+o[k]||0;});}
 if(t==='order_items'&&(t==='order_items')){['order_id','product_id','quantity','unit_price'].forEach(k=>{if(o[k]!=='')o[k]=+o[k]||0;});}
 if(t==='cart_items'){['user_id','product_id','quantity'].forEach(k=>{if(o[k]!=='')o[k]=+o[k]||0;});}
 for(const k in o)if(o[k]==='')delete o[k];
 return o;
}
async function saveNew(){
 const o=fix(cur,grab(el('tb').rows[0],'n'));
 const r=await fetch('/admin/t/'+cur,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});
 const j=await r.json();toast(r.ok?'เพิ่มข้อมูลแล้ว':'เพิ่มไม่สำเร็จ: '+(j.detail||''));stats();load();
}
async function saveEd(id){
 const tr=[...el('tb').rows].find(t=>t.dataset.id===id);if(!tr)return;
 const o=fix(cur,grab(tr,''));
 const[uid,pid]=id.split('_');
 let r;
 if(T[cur].pk){r=await fetch('/admin/t/'+cur+'/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});}
 else{r=await fetch('/admin/t/'+cur+'/'+pid+'?uid='+uid,{method:'PUT'});}
 const j=await r.json();toast(r.ok?'แก้ไขข้อมูลแล้ว':'แก้ไขไม่สำเร็จ: '+(j.detail||''));editing=null;stats();load();
}
async function del(id){
 const[uid,pid]=id.split('_');
 const url=T[cur].pk?'/admin/t/'+cur+'/'+id:'/admin/t/'+cur+'/'+pid+'?uid='+uid;
 if(!confirm('ยืนยันการลบข้อมูล '+id+' ?'))return;
 const r=await fetch(url,{method:'DELETE'});
 toast(r.ok?'ลบข้อมูลแล้ว':'ลบไม่สำเร็จ');stats();load();
}
el('tabs').innerHTML=Object.entries(T).map(([t,v])=>`<div class="tab${t===cur?' active':''}" data-t="${t}">${v.label}</div>`).join('');
el('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.t===t));cur=t;load();};
el('rref').onclick=()=>{stats();load();};
el('add').onclick=add;
el('q').addEventListener('keydown',e=>{if(e.key==='Enter')load();});
stats();load();
</script>
</body>
</html>
