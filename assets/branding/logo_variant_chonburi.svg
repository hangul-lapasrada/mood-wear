<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="รสถิ่น กลิ่นไทย">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Chonburi&amp;display=swap');
    </style>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"  stop-color="#f4813f"/>
      <stop offset="0.45" stop-color="#eb5b24"/>
      <stop offset="1"  stop-color="#d63a12"/>
    </linearGradient>
    <filter id="smoke" x="-40%" y="-120%" width="180%" height="300%">
      <feTurbulence type="fractalNoise" baseFrequency="0.014 0.03" numOctaves="3" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="42" xChannelSelector="R" yChannelSelector="G" result="wisp"/>
      <feGaussianBlur in="wisp" stdDeviation="6" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5" intercept="0"/></feComponentTransfer>
    </filter>
    <filter id="shimmer" x="-5%" y="-5%" width="110%" height="115%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>
    <linearGradient id="risefade" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="fadesmoke"><rect x="0" y="130" width="800" height="640" fill="url(#risefade)"/></mask>
    <path id="spark" d="M0 -7 C1.6 -2.4 2.4 -1.6 7 0 C2.4 1.6 1.6 2.4 0 7 C-1.6 2.4 -2.4 1.6 -7 0 C-2.4 -1.6 -1.6 -2.4 0 -7 Z"/>
  </defs>

  <rect width="800" height="800" fill="#6b6b3a"/>
  <ellipse cx="400" cy="400" rx="260" ry="200" fill="#eb5b24" opacity="0.10" filter="url(#glow)"/>

  <g mask="url(#fadesmoke)" opacity="0.5">
    <text x="400" y="350" text-anchor="middle" font-family="'Chonburi', serif" font-size="112" fill="#efe3c6" filter="url(#smoke)">รสถิ่น</text>
    <text x="400" y="510" text-anchor="middle" font-family="'Chonburi', serif" font-size="112" fill="#efe3c6" filter="url(#smoke)">กลิ่นไทย</text>
  </g>

  <g filter="url(#shimmer)">
    <text x="400" y="352" text-anchor="middle" font-family="'Chonburi', serif" font-size="116" fill="url(#flame)">รสถิ่น</text>
    <text x="400" y="512" text-anchor="middle" font-family="'Chonburi', serif" font-size="116" fill="url(#flame)">กลิ่นไทย</text>
  </g>

  <g fill="#f4a13a" opacity="0.9">
    <use href="#spark" transform="translate(585 250) scale(1.1)" opacity="0.95"/>
    <use href="#spark" transform="translate(615 200) scale(0.8)" opacity="0.7"/>
    <use href="#spark" transform="translate(215 245) scale(0.9)" opacity="0.8"/>
    <use href="#spark" transform="translate(190 190) scale(0.6)" opacity="0.55"/>
    <use href="#spark" transform="translate(630 315) scale(0.6)" opacity="0.6"/>
  </g>

  <!-- Chopsticks over a wok rim, drawn as one simple stroke -->
  <g stroke="#f4a13a" stroke-width="6" stroke-linecap="round" fill="none">
    <path d="M258 588 H542" stroke-width="7"/>
    <path d="M300 585 L452 560"/>
    <path d="M310 593 L458 566"/>
  </g>
</svg>
